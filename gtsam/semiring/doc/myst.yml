# The book of semiring factor graphs: build with
#   myst build --html     (or: myst start)
# The table of contents below is generated by the book's
# assembly script from the chapter headings.
version: 1
project:
  title: Semiring factor graphs
  description: Optimal control and reinforcement learning as variable elimination on factor graphs, with GTSAM.
  github: https://github.com/thduynguyen/gtsam
  # Formulas are not referred to by number, so do not number them.
  numbering:
    equation:
      enabled: false
  toc:
    - file: index.md
    - title: "Part I: Exact elimination on decision graphs"
      children:
        - file: chapter01.md
          children:
            - file: chapter01_examples.ipynb
        - file: chapter02.md
          children:
            - file: chapter02_examples.ipynb
        - file: chapter03.md
          children:
            - file: chapter03_examples.ipynb
        - file: chapter04.md
          children:
            - file: chapter04_examples.ipynb
        - file: chapter05.md
          children:
            - file: chapter05_examples.ipynb
    - title: Appendices
      children:
        - file: appendix_a.md
        - file: appendix_b.md
site:
  template: book-theme
  title: Semiring factor graphs
  options:
    style: custom.css
