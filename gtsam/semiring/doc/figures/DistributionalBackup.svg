<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">One step with distributions as values</title>
  <desc id="desc">A state, its action and the next state, with dynamics, policy and reward factors. The value factor entering on the next state holds, for each next state, a distribution over the reward still to come. Multiplying with the reward factor shifts each distribution by the reward, and summing out the next state and the action mixes the shifted distributions. The value factor leaving on the state holds a distribution for each state.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="350" y1="170" x2="190" y2="170" stroke="#57606a" stroke-width="2"/>
  <line x1="350" y1="170" x2="350" y2="290" stroke="#57606a" stroke-width="2"/>
  <line x1="350" y1="170" x2="510" y2="170" stroke="#57606a" stroke-width="2"/>
  <line x1="270" y1="230" x2="190" y2="170" stroke="#57606a" stroke-width="2"/>
  <line x1="270" y1="230" x2="350" y2="290" stroke="#57606a" stroke-width="2"/>
  <line x1="190" y1="290" x2="190" y2="170" stroke="#57606a" stroke-width="2"/>
  <line x1="190" y1="290" x2="350" y2="290" stroke="#57606a" stroke-width="2"/>
  <line x1="630" y1="170" x2="510" y2="170" stroke="#57606a" stroke-width="2"/>
  <line x1="70" y1="170" x2="190" y2="170" stroke="#57606a" stroke-width="2"/>
  <path d="M 624.5 153.7 Q 357.4 43.4 86.6 106.2" fill="none" stroke="#a85a08" stroke-width="2" stroke-dasharray="5 4"/><polygon points="75.8,108.6 85.5,101.8 87.6,110.5" fill="#a85a08"/>
  <rect x="342.0" y="162.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="262.0" y="222.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="182.0" y="282.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="622.0" y="162.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="62.0" y="162.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="190" cy="170" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="190" y="176" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s</text>
  <circle cx="350" cy="290" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="350" y="296" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a</text>
  <circle cx="510" cy="170" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="510" y="176" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s′</text>
  <text x="350" y="154" font-size="13" text-anchor="middle" fill="#24292f">p(s′ | s, a)</text>
  <text x="256" y="252" font-size="13" text-anchor="end" fill="#24292f">π(a | s)</text>
  <text x="190" y="318" font-size="13" text-anchor="middle" fill="#a85a08">r(s, a): all mass at z = r</text>
  <text x="650" y="150" font-size="13" text-anchor="start" fill="#a85a08">in: for each s′, a distribution</text>
  <text x="650" y="168" font-size="13" text-anchor="start" fill="#a85a08">over the reward still to come</text>
  <text x="50" y="128" font-size="13" text-anchor="start" fill="#a85a08">out: for each s,</text>
  <text x="50" y="146" font-size="13" text-anchor="start" fill="#a85a08">a distribution</text>
  <text x="350" y="30" font-size="12" text-anchor="middle" fill="#a85a08">multiply with the reward: shift by r (a convolution)</text>
  <text x="350" y="48" font-size="12" text-anchor="middle" fill="#a85a08">sum out s′ and a: mix, weighted by probability</text>
  <line x1="16" y1="350" x2="884" y2="350" stroke="#d0d7de"/>
  <circle cx="32" cy="371" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="375" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="371" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="375" font-size="12" fill="#57606a">action</text>
  <rect x="185.3" y="365" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="206.3" y="375" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="350.0" y="365" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="371.0" y="375" font-size="12" fill="#57606a">(1, v): value</text>
</svg>
