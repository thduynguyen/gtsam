<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">One sampled transition in value-based control</title>
  <desc id="desc">A state, the action taken, the sampled next state and a next action. The dynamics factor is known only through this one sample. A learned factor holds the estimate of Q at the state and action and is updated; a second copy is read at the next state and next action, where SARSA samples the next action from the policy and Q-learning takes the best one.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="280" y1="130" x2="120" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="280" y1="130" x2="280" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="280" y1="130" x2="460" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="120" y1="260" x2="120" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="120" y1="260" x2="280" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="200" y1="195" x2="120" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="200" y1="195" x2="280" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="540" y1="195" x2="460" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="540" y1="195" x2="620" y2="260" stroke="#57606a" stroke-width="2"/>
  <rect x="272.0" y="122.0" width="16" height="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="112.0" y="252.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="192.0" y="187.0" width="16" height="16" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="2"/>
  <rect x="532.0" y="187.0" width="16" height="16" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="2"/>
  <circle cx="120" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="120" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s</text>
  <circle cx="280" cy="260" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="280" y="266" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a</text>
  <circle cx="460" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="460" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s′</text>
  <circle cx="620" cy="260" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="620" y="266" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a′</text>
  <text x="280" y="114" font-size="13" text-anchor="middle" fill="#24292f">one sample of p(s′ | s, a)</text>
  <text x="120" y="288" font-size="13" text-anchor="middle" fill="#a85a08">r(s, a)</text>
  <text x="186" y="217" font-size="13" text-anchor="end" fill="#075e7a">Q̂(s, a): updated</text>
  <text x="556" y="187" font-size="13" text-anchor="start" fill="#075e7a">Q̂(s′, a′): read</text>
  <text x="660" y="300" font-size="12" text-anchor="start" fill="#57606a" font-weight="bold">SARSA: a′ sampled from the policy</text>
  <text x="660" y="318" font-size="12" text-anchor="start" fill="#cf222e" font-weight="bold">Q-learning: a′ = the best move in s′</text>
  <line x1="16" y1="350" x2="884" y2="350" stroke="#d0d7de"/>
  <circle cx="32" cy="371" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="375" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="371" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="375" font-size="12" fill="#57606a">action</text>
  <rect x="185.3" y="365" width="12" height="12" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="206.3" y="375" font-size="12" fill="#57606a">factor known only through samples</text>
  <rect x="438.20000000000005" y="365" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="459.20000000000005" y="375" font-size="12" fill="#57606a">(1, v): value</text>
  <rect x="565.1" y="365" width="12" height="12" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="1.5"/>
  <text x="586.1" y="375" font-size="12" fill="#57606a">learned factor</text>
</svg>
