<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">After eliminating the last state by maximum</title>
  <desc id="desc">The last state is eliminated and keeps a conditional given s1 and a1. The dynamics and final reward factors are replaced by one new value factor joining s1 and a1, holding the best final reward among the outcomes that are possible. The action is about to be eliminated.</desc>
  <rect x="0.5" y="0.5" width="899" height="379" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="320" y1="140" x2="140" y2="140" stroke="#57606a" stroke-width="2"/>
  <line x1="320" y1="140" x2="320" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="140" y1="270" x2="140" y2="140" stroke="#57606a" stroke-width="2"/>
  <line x1="140" y1="270" x2="320" y2="270" stroke="#57606a" stroke-width="2"/>
  <path d="M 164.1 127.9 Q 320.0 50.0 466.0 123.0" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="475.9,127.9 464.0,127.0 468.0,119.0" fill="#8c959f"/>
  <path d="M 341.9 254.2 Q 410.0 205.0 469.2 162.2" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="478.1,155.8 471.8,165.9 466.6,158.6" fill="#8c959f"/>
  <rect x="312.0" y="132.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="132.0" y="262.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="320" cy="270" r="33" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="140" cy="140" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="140" y="146" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="320" cy="270" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="320" y="276" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="500" cy="140" r="24" fill="#f3f4f6" stroke="#8c959f" stroke-width="2" stroke-dasharray="4 3"/><text x="500" y="146" font-size="18" font-style="italic" text-anchor="middle" fill="#8c959f">s<tspan dy="5.4" font-size="13.0">2</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <text x="320" y="124" font-size="13" text-anchor="middle" fill="#a85a08">φ(s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="30" y="40" font-size="13" text-anchor="start" fill="#a85a08">new factor: φ(s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>) = the best r(s<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>) among the possible s<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9" font-size="9.4">​</tspan></text>
  <text x="140" y="298" font-size="13" text-anchor="middle" fill="#a85a08">r(s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="545" y="146" font-size="12" text-anchor="start" fill="#57606a">c(s<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> | s<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6" font-size="8.6">​</tspan>, a<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6" font-size="8.6">​</tspan>): the outcome that was assumed</text>
  <text x="375" y="275" font-size="12" text-anchor="start" fill="#57606a">bucket of a<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6" font-size="8.6">​</tspan>: add the two factors,</text>
  <text x="375" y="293" font-size="12" text-anchor="start" fill="#57606a">then keep the best a<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6" font-size="8.6">​</tspan></text>
  <line x1="16" y1="330" x2="884" y2="330" stroke="#d0d7de"/>
  <circle cx="32" cy="351" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="355" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="351" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="355" font-size="12" fill="#57606a">action</text>
  <rect x="185.3" y="345" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="206.3" y="355" font-size="12" fill="#57606a">value</text>
  <circle cx="267.8" cy="351" r="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="282.8" y="355" font-size="12" fill="#57606a">eliminated; arrows: its conditional</text>
  <circle cx="533.3" cy="351" r="8" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="548.3" y="355" font-size="12" fill="#57606a">being eliminated</text>
</svg>
