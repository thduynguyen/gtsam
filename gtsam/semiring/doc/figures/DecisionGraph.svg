  <text x="790" y="114" font-size="13" text-anchor="middle" fill="#a85a08">r(s<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="700" y="94" font-size="12" text-anchor="middle" fill="#57606a" font-weight="bold">1. average</text>
  <text x="400" y="94" font-size="12" text-anchor="middle" fill="#57606a" font-weight="bold">3. average</text>
