<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The decision graph of the two-move problem</title>
  <desc id="desc">The factor graph of Chapter 1 without its policy factors. The states are eliminated by averaging and the actions by maximizing, in the order last state, last action, middle state, first action, first state.</desc>
