  <circle cx="430" cy="210" r="26.4" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <circle cx="430" cy="110" r="23.2" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <circle cx="670" cy="310" r="28.6" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <circle cx="670" cy="210" r="28.2" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <circle cx="670" cy="110" r="23.2" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="190" y="40" font-size="14" text-anchor="middle" fill="#24292f" font-weight="bold">step 0</text>
  <text x="190" y="315" font-size="14" text-anchor="middle" fill="#24292f" font-weight="bold">44</text>
  <text x="190" y="274.0802010062941" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">0</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.5</text>
  <text x="190" y="215" font-size="14" text-anchor="middle" fill="#24292f" font-weight="bold">56</text>
  <text x="190" y="172.04004454348507" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">0</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.5</text>
