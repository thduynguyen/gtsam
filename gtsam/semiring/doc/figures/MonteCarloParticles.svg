  <text x="670" y="274.44622232382113" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.42</text>
  <text x="670" y="215" font-size="14" text-anchor="middle" fill="#24292f" font-weight="bold">40</text>
  <text x="670" y="174.8210672311918" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.34</text>
  <text x="670" y="115" font-size="14" text-anchor="middle" fill="#24292f" font-weight="bold">18</text>
  <text x="670" y="79.81766235091371" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">2</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.24</text>
  <text x="60" y="315" font-size="13" text-anchor="middle" fill="#57606a">cell 0</text>
  <text x="60" y="215" font-size="13" text-anchor="middle" fill="#57606a">cell 1</text>
  <text x="60" y="115" font-size="13" text-anchor="middle" fill="#57606a">cell 2</text>
  <text x="430" y="384" font-size="12" text-anchor="middle" fill="#57606a">100 rollouts of the coin flip. The number in a circle counts the rollouts in that cell; line widths count the moves.</text>

</svg>
