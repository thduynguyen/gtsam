<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" width="860" height="410" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The forward message as particles</title>
  <desc id="desc">Three columns for the steps 0, 1 and 2 and three rows for the cells. A circle shows how many of 100 sampled rollouts are in that cell at that step, next to the exact visitation probability. Lines between columns show the sampled moves, wider where more rollouts took them.</desc>
