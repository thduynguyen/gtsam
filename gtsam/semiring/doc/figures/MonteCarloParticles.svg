  <line x1="430" y1="210" x2="670" y2="210" stroke="#7aa7e0" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <line x1="430" y1="210" x2="670" y2="110" stroke="#7aa7e0" stroke-width="4.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="430" y1="110" x2="670" y2="210" stroke="#7aa7e0" stroke-width="4.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="430" y1="110" x2="670" y2="110" stroke="#7aa7e0" stroke-width="2.1" stroke-linecap="round" opacity="0.75"/>
  <circle cx="190" cy="310" r="28.9" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <circle cx="190" cy="210" r="31.0" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
