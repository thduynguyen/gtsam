  <line x1="190" y1="210" x2="430" y2="110" stroke="#7aa7e0" stroke-width="6.3" stroke-linecap="round" opacity="0.75"/>
  <line x1="430" y1="310" x2="670" y2="310" stroke="#7aa7e0" stroke-width="9.4" stroke-linecap="round" opacity="0.75"/>
