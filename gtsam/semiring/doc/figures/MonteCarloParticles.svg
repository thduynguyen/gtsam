  <text x="430" y="176.63736552920795" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.3</text>
  <text x="430" y="115" font-size="14" text-anchor="middle" fill="#24292f" font-weight="bold">18</text>
  <text x="430" y="79.81766235091371" font-size="12" text-anchor="middle" fill="#57606a">exact d<tspan dy="3.6" font-size="8.6">1</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> = 0.2</text>
