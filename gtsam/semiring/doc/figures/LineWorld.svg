<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">A robot on a line</title>
  <desc id="desc">A robot on a number line starts around x = 2 and makes two moves toward the origin. Each move adds the action u and Gaussian noise to its position. It is penalized for its distance from the origin and for the size of its moves.</desc>
  <rect x="0.5" y="0.5" width="859" height="299" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="50.0" y1="190" x2="815.0" y2="190" stroke="#24292f" stroke-width="2"/>
  <line x1="80" y1="184" x2="80" y2="196" stroke="#24292f" stroke-width="2"/>
  <text x="80.0" y="214.0" font-size="13" text-anchor="middle" fill="#57606a">-1</text>
  <line x1="230" y1="184" x2="230" y2="196" stroke="#24292f" stroke-width="2"/>
  <text x="230.0" y="214.0" font-size="13" text-anchor="middle" fill="#57606a">0</text>
  <line x1="380" y1="184" x2="380" y2="196" stroke="#24292f" stroke-width="2"/>
  <text x="380.0" y="214.0" font-size="13" text-anchor="middle" fill="#57606a">1</text>
  <line x1="530" y1="184" x2="530" y2="196" stroke="#24292f" stroke-width="2"/>
  <text x="530.0" y="214.0" font-size="13" text-anchor="middle" fill="#57606a">2</text>
  <line x1="680" y1="184" x2="680" y2="196" stroke="#24292f" stroke-width="2"/>
  <text x="680.0" y="214.0" font-size="13" text-anchor="middle" fill="#57606a">3</text>
  <text x="829.0" y="195.0" font-size="13" text-anchor="middle" fill="#24292f" font-style="italic">x</text>
  <line x1="230" y1="128" x2="230" y2="190" stroke="#d9730d" stroke-width="3"/>
  <polygon points="230,128 260,138 230,148" fill="#d9730d"/>
  <text x="230.0" y="234.0" font-size="13" text-anchor="middle" fill="#a85a08">goal: stay near x = 0</text>
  <polyline points="155.0,184.9 163.4,184.5 171.9,184.0 180.3,183.4 188.8,182.7 197.2,182.0 205.6,181.2 214.1,180.4 222.5,179.4 230.9,178.4 239.4,177.3 247.8,176.1 256.2,174.8 264.7,173.4 273.1,171.8 281.6,170.2 290.0,168.5 298.4,166.7 306.9,164.8 315.3,162.9 323.8,160.8 332.2,158.7 340.6,156.5 349.1,154.2 357.5,151.9 365.9,149.5 374.4,147.1 382.8,144.7 391.2,142.4 399.7,140.0 408.1,137.7 416.6,135.4 425.0,133.2 433.4,131.1 441.9,129.1 450.3,127.2 458.8,125.5 467.2,123.9 475.6,122.5 484.1,121.2 492.5,120.2 500.9,119.3 509.4,118.7 517.8,118.2 526.2,118.0 534.7,118.0 543.1,118.3 551.6,118.7 560.0,119.4 568.4,120.3 576.9,121.3 585.3,122.6 593.8,124.0 602.2,125.7 610.6,127.4 619.1,129.3 627.5,131.3 635.9,133.5 644.4,135.7 652.8,137.9 661.2,140.3 669.7,142.6 678.1,145.0 686.6,147.4 695.0,149.8 703.4,152.1 711.9,154.4 720.3,156.7 728.8,158.9 737.2,161.0 745.6,163.1 754.1,165.1 762.5,166.9 770.9,168.7 779.4,170.4 787.8,172.0 796.2,173.5 804.7,174.9 813.1,176.2 821.6,177.4 830.0,178.5" fill="none" stroke="#1a4fa0" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="642.5" y="112.0" font-size="13" text-anchor="start" fill="#1a4fa0">start: x₀ ~ N(2, 1)</text>
  <circle cx="530" cy="172" r="16" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <path d="M 510 172 L 394 172" stroke="#1e7b34" stroke-width="3" fill="none"/>
  <polygon points="380,172 396,165 396,179" fill="#1e7b34"/>
  <text x="447.5" y="160.0" font-size="13" text-anchor="middle" fill="#1e7b34">move u</text>
  <text x="430.0" y="40.0" font-size="13" text-anchor="middle" fill="#24292f">Two moves. Each move: x′ = x + u + w, with wheel slip w ~ N(0, 0.5).</text>
  <text x="430.0" y="62.0" font-size="13" text-anchor="middle" fill="#24292f">Policy: go half way back, with jitter: u = −0.5 x + e, e ~ N(0, 0.1).</text>
  <text x="430.0" y="266.0" font-size="13" text-anchor="middle" fill="#24292f">Rewards: −(x² + u²) at each move, for being far from the goal and for the effort; −x₂² at the end.</text>
</svg>
