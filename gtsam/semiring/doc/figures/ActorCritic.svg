<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 400" width="1010" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Actor-critic as two stages</title>
  <desc id="desc">Two boxes joined by two arrows. Stage 1 holds the chain of states and actions with white dynamics factors, which can only be sampled, and a teal learned value factor, the critic, on every state. It passes the visited states and the TD residuals to Stage 2, the actor, which updates theta by a sampled gradient step and passes new policy factors back.</desc>
  <rect x="0.5" y="0.5" width="1009" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="30" y="40" width="470" height="270" rx="10" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="620" y="40" width="360" height="270" rx="10" fill="none" stroke="#6639ba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="110" y1="90" x2="110" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="90" x2="250" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="390" y1="90" x2="390" y2="150" stroke="#57606a" stroke-width="2"/>
