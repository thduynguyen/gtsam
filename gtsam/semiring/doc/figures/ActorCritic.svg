  <line x1="110" y1="240" x2="180" y2="240" stroke="#57606a" stroke-width="2"/>
  <line x1="320" y1="150" x2="250" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="320" y1="150" x2="320" y2="240" stroke="#57606a" stroke-width="2"/>
  <line x1="320" y1="150" x2="390" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="285" y1="195" x2="250" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="285" y1="195" x2="320" y2="240" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="240" x2="250" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="240" x2="320" y2="240" stroke="#57606a" stroke-width="2"/>
