  <path d="M 616.0 220.0 Q 560.0 220.0 515.0 220.0" fill="none" stroke="#6639ba" stroke-width="2"/><polygon points="504.0,220.0 515.0,215.5 515.0,224.5" fill="#6639ba"/>
  <rect x="103.0" y="83.0" width="14" height="14" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="2"/>
  <rect x="243.0" y="83.0" width="14" height="14" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="2"/>
  <rect x="383.0" y="83.0" width="14" height="14" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="2"/>
  <rect x="172.0" y="142.0" width="16" height="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="137.0" y="187.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="102.0" y="232.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="312.0" y="142.0" width="16" height="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="277.0" y="187.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="242.0" y="232.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="110" cy="150" r="20" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="110" y="156" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="250" cy="150" r="20" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="250" y="156" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="390" cy="150" r="20" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="390" y="156" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">2</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="180" cy="240" r="20" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="180" y="246" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="320" cy="240" r="20" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="320" y="246" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="800" cy="140" r="24" fill="#eadcff" stroke="#6639ba" stroke-width="2"/><text x="800" y="146" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">θ</text>
  <text x="40" y="58" font-size="12" text-anchor="start" fill="#57606a" font-weight="bold">Stage 1: sample with θ<tspan dy="3.6" font-size="8.6">k</tspan><tspan dy="-3.6" font-size="8.6">​</tspan>, and learn the backward message</text>
  <text x="630" y="58" font-size="12" text-anchor="start" fill="#6639ba" font-weight="bold">Stage 2: the actor</text>
  <text x="126" y="95" font-size="13" text-anchor="start" fill="#075e7a">critic V̂</text>
  <text x="266" y="95" font-size="13" text-anchor="start" fill="#075e7a">V̂</text>
  <text x="406" y="95" font-size="13" text-anchor="start" fill="#075e7a">V̂</text>
  <text x="445" y="156" font-size="20" text-anchor="middle" fill="#57606a">…</text>
  <text x="265" y="292" font-size="12" text-anchor="middle" fill="#075e7a">the critic is updated from each sampled transition</text>
  <text x="800" y="205" font-size="13" text-anchor="middle" fill="#24292f">θ<tspan dy="3.9" font-size="9.4">k+1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> = θ<tspan dy="3.9" font-size="9.4">k</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> + α (sampled gradient)</text>
  <text x="800" y="232" font-size="12" text-anchor="middle" fill="#57606a">score of each visited (s, a)</text>
  <text x="800" y="248" font-size="12" text-anchor="middle" fill="#57606a">times its TD residual</text>
  <text x="560" y="84" font-size="12" text-anchor="middle" fill="#57606a">visited states,</text>
  <text x="560" y="99" font-size="12" text-anchor="middle" fill="#57606a">TD residuals</text>
  <text x="560" y="242" font-size="12" text-anchor="middle" fill="#6639ba">new policy</text>
  <text x="560" y="257" font-size="12" text-anchor="middle" fill="#6639ba">factors π<tspan dy="3.6" font-size="8.6">θ</tspan><tspan dy="-3.6" font-size="8.6">​</tspan></text>
  <line x1="16" y1="350" x2="994" y2="350" stroke="#d0d7de"/>
  <circle cx="32" cy="371" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="375" font-size="12" fill="#57606a">state</text>
  <rect x="102.5" y="365" width="12" height="12" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="1.5"/>
  <text x="123.5" y="375" font-size="12" fill="#57606a">learned factor</text>
  <circle cx="241.7" cy="371" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="256.7" y="375" font-size="12" fill="#57606a">action</text>
  <rect x="318.5" y="365" width="12" height="12" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="339.5" y="375" font-size="12" fill="#57606a">factor known only through samples</text>
  <rect x="571.4" y="365" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="592.4" y="375" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="736.0999999999999" y="365" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="757.0999999999999" y="375" font-size="12" fill="#57606a">(1, v): value</text>
  <circle cx="868.9999999999999" cy="371" r="8" fill="#eadcff" stroke="#6639ba" stroke-width="2"/>
  <text x="883.9999999999999" y="375" font-size="12" fill="#57606a">parameter</text>
</svg>
