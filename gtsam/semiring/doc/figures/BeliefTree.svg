  <line x1="450" y1="79" x2="660" y2="146" stroke="#57606a" stroke-width="2"/>
  <line x1="240" y1="194" x2="120" y2="276" stroke="#57606a" stroke-width="2"/>
  <line x1="240" y1="194" x2="360" y2="276" stroke="#57606a" stroke-width="2"/>
  <line x1="660" y1="194" x2="540" y2="276" stroke="#57606a" stroke-width="2"/>
  <line x1="660" y1="194" x2="780" y2="276" stroke="#57606a" stroke-width="2"/>
  <text x="450" y="50" font-size="12" text-anchor="middle" fill="#24292f" font-weight="bold">U: 1, 1   K: 12, 8</text>
  <text x="450" y="68" font-size="12" text-anchor="middle" fill="#57606a">10 pulls left: best 6.369</text>
  <text x="240" y="165" font-size="12" text-anchor="middle" fill="#cf222e" font-weight="bold">pull U</text>
