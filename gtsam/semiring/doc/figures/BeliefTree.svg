<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The first levels of the tree of beliefs</title>
  <desc id="desc">A tree. The root is the starting belief, counts 1, 1 for arm U and 12, 8 for arm K, with 10 pulls left. It branches by a maximum into pulling U, worth 6.369, and pulling K, worth 6.314. Each of those branches by an average into a success and a failure, which lead to four new beliefs with one count increased.</desc>
