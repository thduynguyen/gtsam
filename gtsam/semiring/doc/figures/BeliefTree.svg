  <text x="660" y="165" font-size="12" text-anchor="middle" fill="#cf222e" font-weight="bold">pull K</text>
  <text x="660" y="183" font-size="12" text-anchor="middle" fill="#57606a">value 6.314</text>
  <text x="317.0" y="108.5" font-size="12" text-anchor="middle" fill="#cf222e">max</text>
  <text x="583.0" y="108.5" font-size="12" text-anchor="middle" fill="#cf222e">max</text>
  <text x="120" y="295" font-size="12" text-anchor="middle" fill="#24292f" font-weight="bold">U: 2, 1   K: 12, 8</text>
  <text x="120" y="313" font-size="12" text-anchor="middle" fill="#57606a">9 pulls left: 6.339</text>
  <text x="132.0" y="235.0" font-size="12" text-anchor="middle" fill="#57606a">success 0.5</text>
