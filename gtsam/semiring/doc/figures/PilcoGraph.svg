<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The graph of PILCO</title>
  <desc id="desc">The chain of states and actions with policy factors that depend on a parameter theta, reward factors, and dynamics factors drawn in teal: each is a Gaussian process learned from transitions. Above each state is its forward message, a Gaussian, carried from one state to the next by moment matching.</desc>
