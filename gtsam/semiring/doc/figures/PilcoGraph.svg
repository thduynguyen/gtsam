  <text x="400" y="62" font-size="13" text-anchor="middle" fill="#075e7a" font-weight="bold">N(μ<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, Σ<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
