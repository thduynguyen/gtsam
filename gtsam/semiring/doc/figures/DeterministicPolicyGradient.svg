<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The deterministic policy gradient on one step</title>
  <desc id="desc">A state, an action and a sampled next state. The policy factor is a hard constraint that sets the action to a function of the state with parameter theta. A learned critic factor joins the state and the action. Two arrows show the chain rule: the derivative of the action with respect to theta, and the derivative of the critic with respect to the action.</desc>
  <rect x="0.5" y="0.5" width="899" height="429" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="330" y1="120" x2="140" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="330" y1="120" x2="330" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="330" y1="120" x2="520" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="235" y1="190" x2="140" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="235" y1="190" x2="330" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="235" y1="190" x2="140" y2="330" stroke="#57606a" stroke-width="2"/>
  <line x1="600" y1="260" x2="330" y2="260" stroke="#57606a" stroke-width="2"/>
  <line x1="600" y1="260" x2="140" y2="120" stroke="#57606a" stroke-width="2"/>
  <path d="M 160.0 356.0 Q 213.5 288.0 289.0 289.7" fill="none" stroke="#6639ba" stroke-width="2"/><polygon points="300.0,290.0 288.9,294.2 289.1,285.2" fill="#6639ba"/>
  <path d="M 590.0 280.0 Q 475.5 305.4 372.6 278.8" fill="none" stroke="#075e7a" stroke-width="2"/><polygon points="362.0,276.0 373.8,274.4 371.5,283.1" fill="#075e7a"/>
  <rect x="322.0" y="112.0" width="16" height="16" fill="#ffffff" stroke="#24292f" stroke-width="2"/>
  <rect x="227.0" y="182.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="592.0" y="252.0" width="16" height="16" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="2"/>
  <circle cx="140" cy="120" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="140" y="126" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">x</text>
  <circle cx="330" cy="260" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="330" y="266" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">u</text>
  <circle cx="520" cy="120" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="520" y="126" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">x′</text>
  <circle cx="140" cy="330" r="24" fill="#eadcff" stroke="#6639ba" stroke-width="2"/><text x="140" y="336" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">θ</text>
  <text x="330" y="104" font-size="13" text-anchor="middle" fill="#24292f">one sample of p(x′ | x, u)</text>
  <text x="219" y="186" font-size="13" text-anchor="end" fill="#24292f">policy: u = μ<tspan dy="3.9" font-size="9.4">θ</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>(x)</text>
  <text x="600" y="244" font-size="13" text-anchor="middle" fill="#075e7a">critic Q̂(x, u)</text>
  <text x="250" y="362" font-size="12" text-anchor="start" fill="#6639ba" font-weight="bold">1. dμ<tspan dy="3.6" font-size="8.6">θ</tspan><tspan dy="-3.6" font-size="8.6">​</tspan>/dθ: how the action moves with θ</text>
  <text x="490" y="330" font-size="12" text-anchor="middle" fill="#075e7a" font-weight="bold">2. dQ̂/du: which way the action should move</text>
  <line x1="16" y1="380" x2="884" y2="380" stroke="#d0d7de"/>
  <circle cx="32" cy="401" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="405" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="401" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="405" font-size="12" fill="#57606a">action</text>
  <circle cx="191.3" cy="401" r="8" fill="#eadcff" stroke="#6639ba" stroke-width="2"/>
  <text x="206.3" y="405" font-size="12" fill="#57606a">parameter</text>
  <rect x="287.0" y="395" width="12" height="12" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="308.0" y="405" font-size="12" fill="#57606a">factor known only through samples</text>
  <rect x="539.9" y="395" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="560.9" y="405" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="704.5999999999999" y="395" width="12" height="12" fill="#0a7ea4" stroke="#0a7ea4" stroke-width="1.5"/>
  <text x="725.5999999999999" y="405" font-size="12" fill="#57606a">learned factor</text>
</svg>
