<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" width="820" height="370" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">One step of a stationary chain</title>
  <desc id="desc">A state, its action and the next state, with the dynamics, policy and reward factors. A value factor holding V enters on the next state. After eliminating the next state and the action, a value factor holding the same function V leaves on the state.</desc>
  <rect x="0.5" y="0.5" width="819" height="369" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="320" y1="150" x2="160" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="320" y1="150" x2="320" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="320" y1="150" x2="480" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="240" y1="210" x2="160" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="240" y1="210" x2="320" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="160" y1="270" x2="160" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="160" y1="270" x2="320" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="600" y1="150" x2="480" y2="150" stroke="#57606a" stroke-width="2"/>
  <line x1="50" y1="150" x2="160" y2="150" stroke="#57606a" stroke-width="2"/>
  <path d="M 594.4 133.8 Q 325.0 26.0 65.8 129.7" fill="none" stroke="#a85a08" stroke-width="2" stroke-dasharray="5 4"/><polygon points="55.6,133.8 64.1,125.5 67.5,133.9" fill="#a85a08"/>
  <rect x="312.0" y="142.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="232.0" y="202.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="152.0" y="262.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="592.0" y="142.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="42.0" y="142.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="160" cy="150" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="160" y="156" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s</text>
  <circle cx="320" cy="270" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="320" y="276" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a</text>
  <circle cx="480" cy="150" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="480" y="156" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s′</text>
  <text x="320" y="134" font-size="13" text-anchor="middle" fill="#24292f">γ p(s′ | s, a)</text>
  <text x="226" y="232" font-size="13" text-anchor="end" fill="#24292f">π(a | s)</text>
  <text x="160" y="298" font-size="13" text-anchor="middle" fill="#a85a08">r(s, a)</text>
  <text x="600" y="178" font-size="13" text-anchor="middle" fill="#a85a08">in: (1, V(s′))</text>
  <text x="50" y="178" font-size="13" text-anchor="middle" fill="#a85a08">out: (1, V(s))</text>
  <text x="325" y="62" font-size="12" text-anchor="middle" fill="#a85a08">eliminate s′, then a: the same function V comes out</text>
  <line x1="16" y1="320" x2="804" y2="320" stroke="#d0d7de"/>
  <circle cx="32" cy="341" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="345" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="341" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="345" font-size="12" fill="#57606a">action</text>
  <rect x="185.3" y="335" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="206.3" y="345" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="350.0" y="335" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="371.0" y="345" font-size="12" fill="#57606a">(1, v): value</text>
</svg>
