  <line x1="290" y1="130" x2="350" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="260" y1="168" x2="230" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="260" y1="168" x2="290" y2="205" stroke="#57606a" stroke-width="2"/>
  <line x1="230" y1="205" x2="230" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="230" y1="205" x2="290" y2="205" stroke="#57606a" stroke-width="2"/>
