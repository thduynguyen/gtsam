<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The two-stage framework</title>
  <desc id="desc">Two boxes joined by two arrows. Stage 1 holds the factor graph of states and actions and eliminates it with the parameter theta fixed; it passes the expected return and the forward and backward messages to Stage 2. Stage 2 updates theta and passes new policy factors back to Stage 1.</desc>
