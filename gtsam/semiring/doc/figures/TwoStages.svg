  <circle cx="230" cy="130" r="20" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="230" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="350" cy="130" r="20" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="350" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">2</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
