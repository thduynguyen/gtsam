  <text x="50" y="68" font-size="12" text-anchor="start" fill="#57606a" font-weight="bold">Stage 1: eliminate, with θ fixed at θ<tspan dy="3.6" font-size="8.6">k</tspan><tspan dy="-3.6" font-size="8.6">​</tspan></text>
  <text x="570" y="68" font-size="12" text-anchor="start" fill="#6639ba" font-weight="bold">Stage 2: update θ</text>
  <text x="710" y="210" font-size="13" text-anchor="middle" fill="#24292f">θ<tspan dy="3.9" font-size="9.4">k+1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> = update(θ<tspan dy="3.9" font-size="9.4">k</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>; messages)</text>
  <text x="710" y="232" font-size="12" text-anchor="middle" fill="#57606a">greedy, gradient, natural gradient,</text>
  <text x="710" y="248" font-size="12" text-anchor="middle" fill="#57606a">trust region, EM, sampling</text>
  <text x="490" y="98" font-size="12" text-anchor="middle" fill="#57606a">J(θ<tspan dy="3.6" font-size="8.6">k</tspan><tspan dy="-3.6" font-size="8.6">​</tspan>), forward and</text>
  <text x="490" y="112" font-size="12" text-anchor="middle" fill="#57606a">backward messages</text>
  <text x="490" y="222" font-size="12" text-anchor="middle" fill="#6639ba">new policy</text>
  <text x="490" y="236" font-size="12" text-anchor="middle" fill="#6639ba">factors π<tspan dy="3.6" font-size="8.6">θ</tspan><tspan dy="-3.6" font-size="8.6">​</tspan></text>

