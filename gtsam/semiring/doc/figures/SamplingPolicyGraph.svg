  <text x="250.0" y="104" font-size="13" text-anchor="middle" fill="#24292f">p(x<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | x<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="100" y="278" font-size="13" text-anchor="middle" fill="#a85a08">r(x<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="550.0" y="104" font-size="13" text-anchor="middle" fill="#24292f">p(x<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | x<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="400" y="278" font-size="13" text-anchor="middle" fill="#a85a08">r(x<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="790" y="126" font-size="22" text-anchor="middle" fill="#57606a">…</text>
  <text x="234" y="335" font-size="13" text-anchor="end" fill="#24292f">N(u<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>; ū<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, Σ<tspan dy="3.9" font-size="9.4">e</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="566" y="335" font-size="13" text-anchor="start" fill="#24292f">N(u<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>; ū<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, Σ<tspan dy="3.9" font-size="9.4">e</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="440" y="418" font-size="12" text-anchor="start" fill="#57606a">the plan: the mean of the sampling distribution</text>
  <line x1="16" y1="450" x2="884" y2="450" stroke="#d0d7de"/>
  <circle cx="32" cy="471" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="475" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="471" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="475" font-size="12" fill="#57606a">action</text>
  <rect x="185.3" y="465" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="206.3" y="475" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="350.0" y="465" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="371.0" y="475" font-size="12" fill="#57606a">(1, v): value</text>
  <circle cx="482.9" cy="471" r="8" fill="#eadcff" stroke="#6639ba" stroke-width="2"/>
  <text x="497.9" y="475" font-size="12" fill="#57606a">parameter</text>
</svg>
