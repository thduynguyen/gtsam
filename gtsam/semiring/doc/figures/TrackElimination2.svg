<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">After eliminating a₁</title>
  <desc id="desc">The graph after eliminating s₂, a₁: each eliminated variable keeps a conditional, drawn as arrows from its parents, and the newest value factor is shown in orange.</desc>
  <rect x="0.5" y="0.5" width="859" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="100" y1="50" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="130" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="130" x2="250" y2="290" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="130" x2="400" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="175" y1="210" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="175" y1="210" x2="250" y2="290" stroke="#57606a" stroke-width="2"/>
  <line x1="100" y1="290" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="100" y1="290" x2="250" y2="290" stroke="#57606a" stroke-width="2"/>
  <line x1="400" y1="290" x2="400" y2="130" stroke="#57606a" stroke-width="2"/>
  <path d="M 422 114 Q 550.0 40 675.8 112.0" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="681.0,115.0 669.2,113.4 673.7,105.6" fill="#8c959f"/>
  <path d="M 566.4 272.5 L 678.8 152.6" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="682.9,148.2 678.7,159.3 672.1,153.2" fill="#8c959f"/>
  <path d="M 416.4 147.5 L 528.8 267.4" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="532.9,271.8 522.1,266.8 528.7,260.7" fill="#8c959f"/>
  <rect x="92.0" y="42.0" width="16" height="16" fill="#24292f"/>
  <rect x="242.0" y="122.0" width="16" height="16" fill="#24292f"/>
  <rect x="167.0" y="202.0" width="16" height="16" fill="#24292f"/>
  <rect x="92.0" y="282.0" width="16" height="16" fill="#d9730d"/>
  <rect x="392.0" y="282.0" width="16" height="16" fill="#d9730d"/>
  <circle cx="400" cy="130" r="33" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="100" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="100" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s₀</text>
  <circle cx="400" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="400" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s₁</text>
  <circle cx="700" cy="130" r="24" fill="#f3f4f6" stroke="#8c959f" stroke-width="2" stroke-dasharray="4 3"/><text x="700" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#8c959f">s₂</text>
  <circle cx="250" cy="290" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="250" y="296" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a₀</text>
  <circle cx="550" cy="290" r="24" fill="#f3f4f6" stroke="#8c959f" stroke-width="2" stroke-dasharray="4 3"/><text x="550" y="296" font-size="18" font-style="italic" text-anchor="middle" fill="#8c959f">a₁</text>
  <text x="116" y="55" font-size="13" text-anchor="start" fill="#24292f">(p(s₀), 0)</text>
  <text x="250" y="108" font-size="13" text-anchor="middle" fill="#24292f">(p(s₁ | s₀, a₀), 0)</text>
  <text x="186" y="244" font-size="13" text-anchor="end" fill="#24292f">(π(a₀ | s₀), 0)</text>
  <text x="100" y="322" font-size="13" text-anchor="middle" fill="#a85a08">(1, r(s₀, a₀))</text>
  <text x="400" y="322" font-size="13" text-anchor="middle" fill="#a85a08">φ(s₁) = (1, V₁)</text>
  <text x="700" y="82" font-size="13" text-anchor="middle" fill="#57606a">c(s₂ | s₁, a₁)</text>
  <text x="550" y="337" font-size="13" text-anchor="middle" fill="#57606a">c(a₁ | s₁)</text>
  <line x1="16" y1="350" x2="844" y2="350" stroke="#d0d7de"/>
  <g font-size="12" fill="#57606a">
    <rect x="24" y="365" width="12" height="12" fill="#24292f"/>
    <text x="42" y="375">(p, 0): probability factor</text>
    <rect x="206" y="365" width="12" height="12" fill="#d9730d"/>
    <text x="224" y="375">(1, v): value factor</text>
    <circle cx="362" cy="371" r="8" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="377" y="375">eliminated next</text>
    <circle cx="492" cy="371" r="8" fill="#f3f4f6" stroke="#8c959f" stroke-width="2" stroke-dasharray="3 2"/>
    <text x="507" y="375">eliminated; arrows come from the parents of its conditional</text>
  </g>
</svg>
