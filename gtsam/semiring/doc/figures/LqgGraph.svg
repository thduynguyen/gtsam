<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The factor graph of an LQG problem</title>
  <desc id="desc">A chain of three states with two actions below it and two observations above it. Each observation is joined to its state by an observation factor. A forward arrow above the graph marks the Kalman filter, computed on the probability channel, and a backward arrow below the graph marks the Riccati recursion, computed on the value channel.</desc>
