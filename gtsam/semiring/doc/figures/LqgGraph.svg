  <circle cx="280" cy="335" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="280" y="341" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">u<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="430" cy="95" r="24" fill="#fff4c2" stroke="#9a6700" stroke-width="2"/><text x="430" y="101" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">y<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
