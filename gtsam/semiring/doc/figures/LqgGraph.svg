  <line x1="580" y1="210" x2="730" y2="210" stroke="#57606a" stroke-width="2"/>
  <line x1="430" y1="335" x2="430" y2="210" stroke="#57606a" stroke-width="2"/>
  <line x1="430" y1="335" x2="580" y2="335" stroke="#57606a" stroke-width="2"/>
  <line x1="820" y1="210" x2="730" y2="210" stroke="#57606a" stroke-width="2"/>
  <path d="M 130.0 38.0 Q 445.0 38.0 749.0 38.0" fill="none" stroke="#075e7a" stroke-width="2"/><polygon points="760.0,38.0 749.0,42.5 749.0,33.5" fill="#075e7a"/>
