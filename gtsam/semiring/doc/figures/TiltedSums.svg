<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">Which sum eliminates each variable</title>
  <desc id="desc">One time step of the graph: a state, its action and the next state, with the dynamics, base policy and reward factors and the value of the future. Below it a table: optimal control uses a maximum over the action and an average over the next state; soft control a soft maximum and an average; risk-sensitive control a maximum and a tilted mean; control as inference a soft maximum and a tilted mean.</desc>
  <rect x="0.5" y="0.5" width="899" height="449" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="50" y1="330" x2="760" y2="330" stroke="#d0d7de"/>
  <line x1="300" y1="110" x2="150" y2="110" stroke="#57606a" stroke-width="2"/>
  <line x1="300" y1="110" x2="300" y2="230" stroke="#57606a" stroke-width="2"/>
  <line x1="300" y1="110" x2="450" y2="110" stroke="#57606a" stroke-width="2"/>
  <line x1="225" y1="170" x2="150" y2="110" stroke="#57606a" stroke-width="2"/>
  <line x1="225" y1="170" x2="300" y2="230" stroke="#57606a" stroke-width="2"/>
  <line x1="150" y1="230" x2="150" y2="110" stroke="#57606a" stroke-width="2"/>
  <line x1="150" y1="230" x2="300" y2="230" stroke="#57606a" stroke-width="2"/>
  <line x1="560" y1="110" x2="450" y2="110" stroke="#57606a" stroke-width="2"/>
  <rect x="292.0" y="102.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="217.0" y="162.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="142.0" y="222.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="552.0" y="102.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="150" cy="110" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="150" y="116" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s</text>
  <circle cx="300" cy="230" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="300" y="236" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a</text>
  <circle cx="450" cy="110" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="450" y="116" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s′</text>
  <text x="300" y="94" font-size="13" text-anchor="middle" fill="#24292f">p(s′ | s, a)</text>
  <text x="211" y="192" font-size="13" text-anchor="end" fill="#24292f">π(a | s)</text>
  <text x="150" y="258" font-size="13" text-anchor="middle" fill="#a85a08">r(s, a)</text>
  <text x="560" y="94" font-size="13" text-anchor="middle" fill="#a85a08">(1, V(s′))</text>
  <text x="60" y="322" font-size="13" text-anchor="start" fill="#57606a" font-weight="bold"></text>
  <text x="420" y="322" font-size="13" text-anchor="middle" fill="#57606a" font-weight="bold">the action a</text>
  <text x="640" y="322" font-size="13" text-anchor="middle" fill="#57606a" font-weight="bold">the next state s′</text>
  <text x="60" y="346" font-size="13" text-anchor="start" fill="#57606a" font-weight="bold">optimal control (Ch. 4, 6)</text>
  <text x="420" y="346" font-size="13" text-anchor="middle" fill="#57606a">maximum</text>
  <text x="640" y="346" font-size="13" text-anchor="middle" fill="#57606a">average</text>
  <text x="60" y="370" font-size="13" text-anchor="start" fill="#1e7b34" font-weight="bold">soft control</text>
  <text x="420" y="370" font-size="13" text-anchor="middle" fill="#1e7b34">soft maximum</text>
  <text x="640" y="370" font-size="13" text-anchor="middle" fill="#1e7b34">average</text>
  <text x="60" y="394" font-size="13" text-anchor="start" fill="#1a4fa0" font-weight="bold">risk-sensitive control</text>
  <text x="420" y="394" font-size="13" text-anchor="middle" fill="#1a4fa0">maximum</text>
  <text x="640" y="394" font-size="13" text-anchor="middle" fill="#1a4fa0">tilted mean</text>
  <text x="60" y="418" font-size="13" text-anchor="start" fill="#cf222e" font-weight="bold">control as inference</text>
  <text x="420" y="418" font-size="13" text-anchor="middle" fill="#cf222e">soft maximum</text>
  <text x="640" y="418" font-size="13" text-anchor="middle" fill="#cf222e">tilted mean</text>
