<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">A bandit with an unknown model</title>
  <desc id="desc">Three pulls. Each pull has an action, the arm, and an observed outcome, joined by an outcome factor. One parameter node, the unknown success probabilities, is joined to every outcome factor and has a prior. Dashed arrows show that each action may depend on the outcomes before it.</desc>
