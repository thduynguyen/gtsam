<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">A discounted chain with a termination outcome</title>
  <desc id="desc">The chain of states and actions of Chapter 1. Each dynamics factor continues to the next state with probability gamma, and with probability one minus gamma leads to an extra state, ended, drawn in grey, where nothing more is collected.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="100" y1="40" x2="100" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="120" x2="100" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="120" x2="250" y2="250" stroke="#57606a" stroke-width="2"/>
  <line x1="250" y1="120" x2="400" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="175" y1="185" x2="100" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="175" y1="185" x2="250" y2="250" stroke="#57606a" stroke-width="2"/>
  <line x1="100" y1="250" x2="100" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="100" y1="250" x2="250" y2="250" stroke="#57606a" stroke-width="2"/>
  <line x1="550" y1="120" x2="400" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="550" y1="120" x2="550" y2="250" stroke="#57606a" stroke-width="2"/>
  <line x1="550" y1="120" x2="700" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="475" y1="185" x2="400" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="475" y1="185" x2="550" y2="250" stroke="#57606a" stroke-width="2"/>
  <line x1="400" y1="250" x2="400" y2="120" stroke="#57606a" stroke-width="2"/>
  <line x1="400" y1="250" x2="550" y2="250" stroke="#57606a" stroke-width="2"/>
  <path d="M 258.0 128.0 Q 515.0 378.4 814.5 263.6" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="824.8,259.7 816.1,267.8 812.9,259.4" fill="#8c959f"/>
  <path d="M 558.0 128.0 Q 689.4 224.0 812.5 243.9" fill="none" stroke="#8c959f" stroke-width="2"/><polygon points="823.3,245.7 811.8,248.4 813.2,239.5" fill="#8c959f"/>
  <rect x="92.0" y="32.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="242.0" y="112.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="167.0" y="177.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="92.0" y="242.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="542.0" y="112.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="467.0" y="177.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="392.0" y="242.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="100" cy="120" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="100" y="126" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="400" cy="120" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="400" y="126" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="700" cy="120" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="700" y="126" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">s<tspan dy="5.4" font-size="13.0">2</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="250" cy="250" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="250" y="256" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="550" cy="250" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="550" y="256" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">a<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="850" cy="250" r="24" fill="#e6e8eb" stroke="#57606a" stroke-width="2"/><text x="850" y="256" font-size="18" font-style="italic" text-anchor="middle" fill="#57606a">∅</text>
  <text x="116" y="45" font-size="13" text-anchor="start" fill="#24292f">p(s<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="250" y="104" font-size="13" text-anchor="middle" fill="#24292f">γ p(s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | s<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="161" y="207" font-size="13" text-anchor="end" fill="#24292f">π(a<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | s<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="100" y="278" font-size="13" text-anchor="middle" fill="#a85a08">r(s<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="550" y="104" font-size="13" text-anchor="middle" fill="#24292f">γ p(s<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="461" y="207" font-size="13" text-anchor="end" fill="#24292f">π(a<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="400" y="278" font-size="13" text-anchor="middle" fill="#a85a08">r(s<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, a<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="760" y="318" font-size="12" text-anchor="middle" fill="#8c959f">ended, with probability 1 − γ</text>
  <text x="800" y="125" font-size="22" text-anchor="middle" fill="#57606a">…</text>
  <line x1="16" y1="350" x2="884" y2="350" stroke="#d0d7de"/>
  <circle cx="32" cy="371" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="375" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="371" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="375" font-size="12" fill="#57606a">action</text>
  <circle cx="191.3" cy="371" r="8" fill="#e6e8eb" stroke="#57606a" stroke-width="2"/>
  <text x="206.3" y="375" font-size="12" fill="#57606a">ended</text>
  <rect x="261.8" y="365" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="282.8" y="375" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="426.5" y="365" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="447.5" y="375" font-size="12" fill="#57606a">(1, v): value</text>
</svg>
