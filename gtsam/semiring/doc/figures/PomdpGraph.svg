  <text x="700" y="350" font-size="12" text-anchor="middle" fill="#075e7a">dashed arrows: what a decision sees: the reading,</text>
  <text x="700" y="366" font-size="12" text-anchor="middle" fill="#075e7a">never the state. It also remembers earlier readings.</text>
