<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The decision graph with nonlinear dynamics</title>
  <desc id="desc">The decision graph of Chapter 4, with states x and actions u, a dynamics factor and a reward factor per step and no policy factors. The dynamics factor is a Gaussian whose mean f of x and u is not a linear function.</desc>
  <rect x="0.5" y="0.5" width="899" height="399" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <line x1="100" y1="50" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="250.0" y1="130" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="250.0" y1="130" x2="250.0" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="250.0" y1="130" x2="400" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="100" y1="270" x2="100" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="100" y1="270" x2="250.0" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="550.0" y1="130" x2="400" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="550.0" y1="130" x2="550.0" y2="270" stroke="#57606a" stroke-width="2"/>
  <line x1="550.0" y1="130" x2="700" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="400" y1="270" x2="400" y2="130" stroke="#57606a" stroke-width="2"/>
  <line x1="400" y1="270" x2="550.0" y2="270" stroke="#57606a" stroke-width="2"/>
  <rect x="92.0" y="42.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="242.0" y="122.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="92.0" y="262.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <rect x="542.0" y="122.0" width="16" height="16" fill="#24292f" stroke="#24292f" stroke-width="2"/>
  <rect x="392.0" y="262.0" width="16" height="16" fill="#d9730d" stroke="#d9730d" stroke-width="2"/>
  <circle cx="100" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="100" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">x<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="400" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="400" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">x<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="700" cy="130" r="24" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/><text x="700" y="136" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">x<tspan dy="5.4" font-size="13.0">2</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="250.0" cy="270" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="250.0" y="276" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">u<tspan dy="5.4" font-size="13.0">0</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <circle cx="550.0" cy="270" r="24" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/><text x="550.0" y="276" font-size="18" font-style="italic" text-anchor="middle" fill="#24292f">u<tspan dy="5.4" font-size="13.0">1</tspan><tspan dy="-5.4" font-size="13.0">​</tspan></text>
  <text x="116" y="55" font-size="13" text-anchor="start" fill="#24292f">p(x<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="250.0" y="114" font-size="13" text-anchor="middle" fill="#24292f">p(x<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | x<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="100" y="298" font-size="13" text-anchor="middle" fill="#a85a08">r(x<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">0</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="550.0" y="114" font-size="13" text-anchor="middle" fill="#24292f">p(x<tspan dy="3.9" font-size="9.4">2</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | x<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="400" y="298" font-size="13" text-anchor="middle" fill="#a85a08">r(x<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>)</text>
  <text x="790" y="136" font-size="22" text-anchor="middle" fill="#57606a">…</text>
  <text x="450" y="40" font-size="13" text-anchor="middle" fill="#24292f">p(x<tspan dy="3.9" font-size="9.4">t+1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan> | x<tspan dy="3.9" font-size="9.4">t</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">t</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>) = N(x<tspan dy="3.9" font-size="9.4">t+1</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>; f(x<tspan dy="3.9" font-size="9.4">t</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>, u<tspan dy="3.9" font-size="9.4">t</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>), Σ<tspan dy="3.9" font-size="9.4">w</tspan><tspan dy="-3.9" font-size="9.4">​</tspan>),  here f(x, u) = x + tanh(u): not linear in u</text>
  <line x1="16" y1="350" x2="884" y2="350" stroke="#d0d7de"/>
  <circle cx="32" cy="371" r="8" fill="#ddebff" stroke="#1a4fa0" stroke-width="2"/>
  <text x="47" y="375" font-size="12" fill="#57606a">state</text>
  <circle cx="108.5" cy="371" r="8" fill="#dff3e4" stroke="#1e7b34" stroke-width="2"/>
  <text x="123.5" y="375" font-size="12" fill="#57606a">action</text>
  <rect x="185.3" y="365" width="12" height="12" fill="#24292f" stroke="#24292f" stroke-width="1.5"/>
  <text x="206.3" y="375" font-size="12" fill="#57606a">(p, 0): probability</text>
  <rect x="350.0" y="365" width="12" height="12" fill="#d9730d" stroke="#d9730d" stroke-width="1.5"/>
  <text x="371.0" y="375" font-size="12" fill="#57606a">(1, v): value</text>
</svg>
