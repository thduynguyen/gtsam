<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-labelledby="title desc" font-family="Helvetica, Arial, sans-serif">
  <title id="title">The line with a linear-Gaussian policy and its gain as a parameter</title>
  <desc id="desc">The factor graph of the robot on a line with two moves. Each policy factor is a Gaussian whose mean is minus a gain times the state. The gains form a parameter node joined to both policy factors. A forward arrow marks the Gaussian state marginals and a backward arrow marks the quadratic advantages.</desc>
