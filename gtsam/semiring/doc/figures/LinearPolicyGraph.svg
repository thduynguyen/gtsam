  <text x="365" y="405" font-size="12" text-anchor="start" fill="#57606a">the gains: one per move, or one shared</text>
  <text x="430" y="36" font-size="12" text-anchor="middle" fill="#075e7a" font-weight="bold">forward messages: the state is Gaussian, with second moment E[x<tspan dy="3.6" font-size="8.6">t</tspan><tspan dy="-3.6" font-size="8.6">​</tspan> x<tspan dy="3.6" font-size="8.6">t</tspan><tspan dy="-3.6" font-size="8.6">​</tspan><tspan dy="-5.04" font-size="8.6">⊤</tspan><tspan dy="5.04" font-size="8.6">​</tspan>]</text>
