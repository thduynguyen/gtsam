# Builds the book of the semiring chapters (gtsam/semiring/doc) with MyST and
# publishes it on GitHub Pages. The book sources are taken from the
# feature/semiringfactor branch; this workflow lives only on the
# semiring-pages branch. Re-run it after the chapters change.

name: Semiring Book

on:
  push:
    branches:
      - semiring-pages
  workflow_dispatch:

env:
  # The site is served from https://<owner>.github.io/<repository>/
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/semiringfactor
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build the book
        working-directory: gtsam/semiring/doc
        run: myst build --html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: gtsam/semiring/doc/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
